          type: string
          example: master
        isDefault:
          type: boolean
          example: true
        isEnabled:
          type: boolean
          example: true
        lastUpdated:
          type: string
          format: date-time
          example: '2019-05-07T14:29:13.43Z'
          x-scala-type: java.time.Instant
        branchType:
          type: string
          enum:
          - Branch
