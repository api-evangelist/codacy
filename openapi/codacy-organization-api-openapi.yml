components:
  schemas:
    RepositorySummary:
      required:
      - name
      - owner
      - provider
      type: object
      properties:
        repositoryId:
          type: integer
          description: Codacy identifier for this repository.
          format: int64
          example: 45738
        provider:
          $ref: '#/components/schemas/Provider'
        owner:
          type: string
          description: Name of the organization that owns the repository.
          example: codacy
        name:
          type: string
          description: Name of the repository.
          example: codacy-eslint
      description: Essential information to describe a repository.
    OrganizationProductBillingPlan:
      required:
      - product
      type: object
      properties:
        product:
          $ref: '#/components/schemas/CodacyProduct'
        plan:
          $ref: '#/components/schemas/Billing'
    RepositoryListResponse:
      required:
      - data
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Repository'
    JoinStatus:
      type: string
      enum:
      - member
      - pendingMember
      - remoteMember
      x-ms-enum:
        name: JoinStatus
    ProviderIntegrationSettingsBody:
      required:
      - aiEnhancedComments
      - commitStatus
      - pullRequestComment
      - pullRequestSummary
      - availableSettings
      type: object
      properties:
        commitStatus:
          type: boolean
          description: Toggle the feature "Status checks"
        pullRequestComment:
          type: boolean
          description: Toggle the feature "Issue annotations"
        pullRequestSummary:
          type: boolean
          description: Toggle the feature "Issue summaries"
        coverageSummary:
          type: boolean
          description: Toggle the feature "Coverage summary" (GitHub only)
        suggestions:
          type: boolean
          description: Toggle the feature "Suggested fixes" (GitHub only)
        aiEnhancedComments:
          type: boolean
          description: 'Toggle the feature "AI-enhanced comments". If "Suggested fixes" (GitHub only) is also enabled, then the AI-enhanced comments also provide suggested fixes. This is an experimental feature.

            '
        aiPullRequestReviewer:
          type: boolean
          description: 'Toggle the feature "AI Pull Request Reviewer" (GitHub only). When enabled, Codacy will use AI to review pull requests and provide comments on code quality and potential issues. This is an experimental feature.

            '
        aiPullRequestReviewerAutomatic:
          type: boolean
          description: 'Toggle the feature "AI Pull Request Reviewer Automatic" (GitHub only). When enabled, Codacy will use AI to review pull requests and provide comments on code quality and potential issues automatically once, subsequent reviews will have to be explicitly requested.

            '
        pullRequestUnifiedSummary:
          type: boolean
          description: 'Toggle the feature "Pull Request Unified Summary" (GitHub only). When enabled, Codacy provides a unified summary (coverage and analysis).

            '
        availableSettings:
          type: array
          description: List of available settings for the Git provider integration
          items:
            type: string
            example: GitHubCoverageSummary
      description: Default settings for Git provider integrations with a list of available settings
    MembershipPrivilegesBody:
      type: object
      properties:
        permission:
          $ref: '#/components/schemas/MembershipPrivileges'
      description: 'Minimum permission level regarding configuring patterns, configuring which file extensions and branches are analyzed, and ignoring issues and files

        '
    PaymentRequired:
      allOf:
      - $ref: '#/components/schemas/ApiError'
      - required:
        - error
        type: object
        properties:
          error:
            type: string
            default: PaymentRequired
    OrganizationPaywall:
      required:
      - organizationDashboard
      type: object
      properties:
        organizationDashboard:
          type: boolean
          example: true
    BadGateway:
      allOf:
      - $ref: '#/components/schemas/ApiError'
      - required:
        - error
        type: object
        properties:
          error:
            type: string
            default: BadGateway
    MembershipPrivileges:
      type: string
      enum:
      - RepoAdmin
      - RepoWrite
      - RepoRead
      x-ms-enum:
        name: MembershipPrivileges
    ChurnFeedback:
      required:
      - cancelReason
      - joinReason
      type: object
      properties:
        joinReason:
          $ref: '#/components/schemas/Reason'
        cancelReason:
          $ref: '#/components/schemas/Reason'
    ListRequestsToJoinResponse:
      required:
      - data
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
        data:
          type: array
          items:
            $ref: '#/components/schemas/RequestToJoin'
    BillingEstimation:
      type: object
      required:
      - perSeatCents
      - seats
      - taxes
      - subTotalCents
      - totalCents
      - nextBilling
      - isMonthly
      properties:
        perSeatCents:
          type: integer
          format: int32
        seats:
          type: integer
          format: int32
        taxes:
          type: array
          items:
            $ref: '#/components/schemas/TaxEstimation'
        discountCents:
          type: integer
          format: int32
        subTotalCents:
          type: integer
          format: int64
        totalCents:
          type: integer
          format: int64
        nextBilling:
          type: string
          format: date-time
          x-scala-type: java.time.Instant
        isMonthly:
          type: boolean
    OrganizationBillingInformation:
      required:
      - numberOfPurchasedSeats
      - numberOfSeats
      - paymentPlan
      - plan
      - priceInCents
      - subscriptions
      - taxes
      type: object
      properties:
        numberOfSeats:
          type: integer
          format: int32
          example: 42
        numberOfPurchasedSeats:
          type: integer
          format: int32
          example: 100
        paymentPlan:
          $ref: '#/components/schemas/Billing'
        plan:
          $ref: '#/components/schemas/PaymentPlan'
        paymentGateway:
          $ref: '#/components/schemas/PaymentProvider'
        priceInCents:
          type: integer
          description: Final price paid in cents, containing all taxes if applicable. For example, 12020 represents $120.20.
          format: int32
          example: 12020
        pricePerSeatInCents:
          type: integer
          description: Final price paid per seat in cents, containing all taxes if applicable. For example, 1405 represents $14.05.
          format: int32
          example: 1405
        nextPaymentDate:
          type: string
          description: 'Date the current billing period ends. For a renewing subscription, this is the next payment

            date. For a subscription that has been canceled and will not renew, this is the date access

            to the plan and its premium features ends. Empty for plans that don''t have a billing period,

            such as the open-source plan

            '
          format: date-time
          example: '2019-05-07T14:29:13.43Z'
          x-scala-type: java.time.Instant
        invoiceDetails:
          required:
          - firstName
          - lastName
          - email
          - country
          - vat
          - address
          - zip
          - state
          type: object
          properties:
            firstName:
              type: string
            lastName:
              type: string
            email:
              type: string
              description: Invoice email address
              format: email
              example: codacy@codacy.com
            country:
              type: string
              description: Country code
              example: PT
            vat:
              type: string
              description: VAT or equivalent tax number depending on your location
              example: PT999999999
            address:
              type: string
              description: Invoice address
              example: Av. João Crisóstomo, nº31 - 6º, 1050-125 Lisboa
            zip:
              type: string
              description: Postal code or ZIP code
              example: 1050-125
            state:
              type: string
              description: State, province, or administrative region
              example: Lisbon
        taxes:
          type: array
          description: Taxes included in the final price priceInCents.
          items:
            $ref: '#/components/schemas/Tax'
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationProductBillingPlan'
    Repository:
      allOf:
      - $ref: '#/components/schemas/RepositorySummary'
      - required:
        - addedState
        - languages
        - problems
        - standards
        - visibility
        type: object
        properties:
          fullPath:
            type: string
            description: Full path of the repository on the Git provider
            example: codacy/codacy-eslint
          visibility:
            $ref: '#/components/schemas/Visibility'
          remoteIdentifier:
            type: string
            description: Unique identifier of the repository on the Git provider
            example: '3'
          lastUpdated:
            type: string
            description: Timestamp when the repository was last updated. See [Git provider documentation](https://docs.codacy.com/organizations/organization-overview/#last-updated-repositories) for details.
            format: date-time
            example: '2019-05-07T14:29:13.43Z'
            x-scala-type: java.time.Instant
          permission:
            $ref: '#/components/schemas/Permission'
          problems:
            type: array
            items:
              $ref: '#/components/schemas/RepositoryProblem'
          languages:
            type: array
            description: List of the languages in the repository
            example:
            - Java
            - Scala
            - CSS
            items:
              type: string
          stack:
            $ref: '#/components/schemas/RepositoryStack'
          defaultBranch:
            $ref: '#/components/schemas/Branch'
          badges:
            $ref: '#/components/schemas/Badges'
          codingStandardId:
            type: integer
            description: '**Deprecated:** Use `standards` field instead. Coding standard identifier.'
            deprecated: true
            format: int64
          codingStandardName:
            type: string
            description: '**Deprecated:** Use `standards` field instead. Coding standard name.'
            deprecated: true
          standards:
            type: array
            description: List of the coding standard identifiers and names
            items:
              $ref: '#/components/schemas/CodingStandardInfo'
          addedState:
            $ref: '#/components/schemas/AddedState'
          gatePolicyId:
            type: integer
            description: Identifier of the gate policy the repository is following. If not defined, the repository does not follow a gate policy.
            format: int64
          gatePolicyName:
            type: string
            description: Name of the gate policy the repository is following. Present only if the gatePolicyId is defined.
    OrganizationWithMetaResponse:
      required:
      - data
      type: object
      properties:
        data:
          $ref: '#/components/schemas/OrganizationWithMeta'
    JoinModeRequest:
      required:
      - joinMode
      type: object
      properties:
        joinMode:
          $ref: '#/components/schemas/JoinMode'
    CodacyProduct:
      type: string
      description: Codacy product
      example: coverage
      enum:
      - quality
      - coverage
    OrganizationType:
      type: string
      description: The type of Organization
      example: Organization
      enum:
      - Account
      - Organization
      x-ms-enum:
        name: OrganizationType
    CardResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Card'
    Conflict:
      allOf:
      - $ref: '#/components/schemas/ApiError'
      - required:
        - error
        type: object
        properties:
          error:
            type: string
            default: Conflict
    CodingStandardInfo:
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: integer
          description: Identifier of the coding standard
          format: int64
        name:
          type: string
          description: Name of the coding standard
      description: Coding standard identifier and name
    Tax:
      required:
      - name
      - rate
      type: object
      properties:
        name:
          type: string
          description: Name of the tax
        rate:
          type: number
          description: Rate of the tax
          format: double
    OrganizationWithMeta:
      required:
      - analysisConfigurationMinimumPermission
      - membership
      - organization
      - subscriptions
      type: object
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        membership:
          $ref: '#/components/schemas/Membership'
        billing:
          $ref: '#/components/schemas/Billing'
        paywall:
          $ref: '#/components/schemas/Paywall'
        organizationPayWall:
          $ref: '#/components/schemas/OrganizationPaywall'
        analysisConfigurationMinimumPermission:
          $ref: '#/components/schemas/Permission'
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/ProductSubscription'
    ApiError:
      required:
      - actions
      - message
      type: object
      properties:
        message:
          type: string
        innerMessage:
          type: string
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ProblemLink'
    Billing:
      required:
      - isPremium
      - model
      type: object
      properties:
        isPremium:
          type: boolean
          description: Deprecated, use subscriptions.plan.isPremium instead.
          example: true
        model:
          type: string
          example: Auto
          enum:
          - Auto
          - Manual
        code:
          type: string
          description: Deprecated, use subscriptions.plan.code instead.
          example: trial
        monthly:
          type: boolean
          example: true
        price:
          type: integer
          format: int64
          example: 1000
        pricedPerUser:
          type: boolean
          example: true
    OrganizationOnboardingStep:
      required:
      - isCompleted
      - step
      type: object
      properties:
        step:
          type: string
          description: Identifier of the onboarding step
          example: addRepositories | enableStatusChecks
        isCompleted:
          type: boolean
    RepositoryFilter:
      type: string
      description: "Filters where to fetch the repositories from:\n  * `AllSynced` - All organization's repositories in Codacy. Requires Admin access\n  * `NotSynced` - All organization's repositories fetched from provider.\n  * `Synced` - All organization's repositories that the user has access.\n"
      enum:
      - Synced
      - NotSynced
      - AllSynced
      x-ms-enum:
        name: RepositoryFilter
    BadRequest:
      allOf:
      - $ref: '#/components/schemas/ApiError'
      - required:
        - error
        type: object
        properties:
          error:
            type: string
            default: BadRequest
