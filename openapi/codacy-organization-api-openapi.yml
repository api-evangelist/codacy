        reason:
          $ref: '#/components/schemas/LeaveOrgProblem'
      description: Informs if the user can leave the organization and if not, why.
    Provider:
      type: string
      description: Git provider hosting the repository
      example: gh
    RepositoryProblem:
      required:
      - actions
