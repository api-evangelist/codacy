components:
  schemas:
    BulkIgnoreIssuesBody:
      type: object
      properties:
        issueIds:
          type: array
          items:
            type: string
          description: List of issue ids to ignore
        reason:
          type: string
          description: Optional reason for ignoring
        comment:
          type: string
          description: Optional comment
      required:
      - issueIds
    RepositoryWithAnalysisResponse:
      required:
      - data
      type: object
      properties:
        data:
          $ref: '#/components/schemas/RepositoryWithAnalysis'
    QuickfixPatchResponse:
      required:
      - data
      type: object
      properties:
        data:
          required:
          - patch
          type: object
          properties:
            patch:
              type: string
              description: Base64 encoded patch file
    SearchRepositoryIssuesBody:
      type: object
      properties:
        branchName:
          type: string
          description: 'Name of a [repository branch enabled on Codacy](https://docs.codacy.com/repositories-configure/managing-branches/),

            as returned by the endpoint [listRepositoryBranches](#listrepositorybranches).

            By default, uses the main branch defined on the Codacy repository settings.

            '
          example: a-feature-branch-name
        patternIds:
          type: array
          description: Set of code pattern identifiers, as returned by the endpoint [listPatterns](#listpatterns)
          example:
          - ESLint_@typescript-eslint_consistent-indexed-object-style
          - ESLint_@typescript-eslint_no-redeclare
          items:
            type: string
        toolUuids:
          type: array
          description: Set of tool UUIDs to filter issues by the tools that detected them
          example:
          - 847feb32-9ff2-11ea-bb37-0242ac130002
          - cf05f3aa-fd23-4586-8cce-5571b1904586
          items:
            type: string
        languages:
          type: array
          description: Set of language names, without spaces
          example:
          - Java
          - Scala
          - CSS
          - ObjectiveC
          items:
            type: string
        categories:
          type: array
          description: Set of issue categories
          example:
          - Security
          - CodeStyle
          items:
            type: string
        levels:
          type: array
          description: Set of issue severity levels
          example:
          - Error
          - Warning
          items:
            $ref: '#/components/schemas/SeverityLevel'
        tags:
          type: array
          description: Set of issue pattern tags
          example:
          - react
          - angular
          items:
            type: string
        authorEmails:
          type: array
          description: Set of commit author email addresses
          example:
          - example@mail.com
          - another@mail.com
          items:
            type: string
        potentialFalsePositives:
          type: boolean
          description: 'If true, only issues that are potential false positives will be included in the search,

            if false, only issues that are not potential false positives will be included in the search.

            '
          example: true
      description: Search parameters to filter the list of issues in a repository
    AutoconfigRunSummaryResponse:
      description: The latest autoconfig run summary for a repository
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AutoconfigRunSummary'
      required:
      - data
    RepositorySummary:
      required:
      - name
      - owner
      - provider
      type: object
      properties:
        repositoryId:
          type: integer
          description: Codacy identifier for this repository.
          format: int64
          example: 45738
        provider:
          $ref: '#/components/schemas/Provider'
        owner:
          type: string
          description: Name of the organization that owns the repository.
          example: codacy
        name:
          type: string
          description: Name of the repository.
          example: codacy-eslint
      description: Essential information to describe a repository.
    AdvisoryInformation:
      description: Enrichment extracted for the associated advisory, such as vulnerable entry-point functions
      type: object
      required:
      - advisoryId
      - vulnerableFunctions
      properties:
        advisoryId:
          type: string
          description: The advisory identifier
          example: CVE-2024-24786
        vulnerableFunctions:
          type: array
          description: The vulnerable functions of the advisory.
          items:
            type: string
          example:
          - Unmarshal
          - UnmarshalOptions.Unmarshal
        publishedAt:
          type: string
          format: date-time
          x-scala-type: java.time.Instant
          description: When the advisory was published, as reported by OSV.
    RepositoryIdentificationV2:
      required:
      - name
      - repositoryId
      - provider
      - organizationName
      type: object
      properties:
        repositoryId:
          type: integer
          description: Identifier of the repository
          format: int64
        name:
          type: string
          description: Name of the repository
          example: codacy-eslint
        provider:
          $ref: '#/components/schemas/Provider'
        organizationName:
          type: string
          description: Name of the organization
          example: codacy
    ToolReference:
      required:
      - name
      - uuid
      type: object
      properties:
        uuid:
          type: string
          description: Tool unique identifier
          example: 847feb32-9ff2-11ea-bb37-0242ac130002
        name:
          type: string
          description: Name of the tool
          example: ESLint
      description: Details of the tool that found the issue
    SearchOrganizationRepositoriesWithAnalysis:
      type: object
      properties:
        names:
          type: array
          description: List of repository names
          items:
            type: string
      description: Search organization repositories with analysis query body
    CommitReference:
      description: Details of the commit that introduced the issue or null if the issue was introduced in a commit that Codacy didn't analyze
      allOf:
      - $ref: '#/components/schemas/CommitIdentification'
      - type: object
        properties:
          commiter:
            type: string
            description: Email address of the author of the commit
          commiterName:
            type: string
            description: Name of the author of the commit
          timestamp:
            type: string
            description: Time and date of the commit
            format: date-time
            example: '2019-05-07T14:29:13.43Z'
            x-scala-type: java.time.Instant
    PullRequestWithAnalysisListResponse:
      required:
      - data
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PullRequestWithAnalysis'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
    PatternDetails:
      required:
      - category
      - id
      - level
      - severityLevel
      type: object
      properties:
        id:
          type: string
          description: Pattern identifier (unique per tool)
          example: accessor-pairs
        title:
          type: string
          description: Pattern title
        category:
          type: string
          description: Pattern category
          example: Security
        subCategory:
          type: string
          description: Pattern subcategory (optional since some patterns might not have a subcategory)
          example: XSS
        level:
          type: string
          description: Deprecated, use `severityLevel` instead
          example: Error
          enum:
          - Info
          - Warning
          - High
          - Error
          x-ms-enum:
            name: SeverityLevel
        severityLevel:
          $ref: '#/components/schemas/SeverityLevel'
      description: Details of the pattern that was identified in the issue
    DependencyChains:
      type: array
      description: 'Dependency chains showing how the vulnerable package is reached. Each chain is an ordered list of package identifiers from the root package down to the vulnerable package. Only present for SCA findings.

        '
      items:
        type: array
        items:
          type: string
      example:
      - - root-app
        - lodash
        - vulnerable-pkg
    ConfiguredPatternsListResponse:
      required:
      - data
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ConfiguredPattern'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
        meta:
          $ref: '#/components/schemas/ConfiguredPatternListMeta'
    CommitIdentification:
      required:
      - sha
      type: object
      properties:
        sha:
          type: string
          description: Commit SHA
    PullRequestOwner:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          example: Foo
        avatarUrl:
          type: string
          example: https://example.com/foo
        username:
          type: string
          example: foo.bar
        email:
          type: string
          example: foobar@example.com
    IssueStateBody:
      required:
      - ignored
      type: object
      properties:
        ignored:
          type: boolean
          description: True if the issue is ignored
        reason:
          type: string
          enum:
          - AcceptedUse
          - FalsePositive
          - NotExploitable
          - TestCode
          - ExternalCode
          description: Predefined reason for ignoring the issue
          example: FalsePositive
        comment:
          type: string
          description: Optional comment justifying the ignore action
      description: Ignored status of an issue
    PullRequestCoverage:
      type: object
      properties:
        deltaCoverage:
          multipleOf: 0.01
          type: number
          description: Difference between the coverage of the head commit and common ancestor commit of the pull request
          format: double
          example: 71
        diffCoverage:
          $ref: '#/components/schemas/DiffCoverage'
        isUpToStandards:
          type: boolean
          description: True if coverage metrics are at or above gate thresholds
          example: true
        resultReasons:
          type: array
          description: Reasons for the results of coverage analysis
          items:
            $ref: '#/components/schemas/AnalysisResultReason'
    BadGateway:
      allOf:
      - $ref: '#/components/schemas/ApiError'
      - required:
        - error
        type: object
        properties:
          error:
            type: string
            default: BadGateway
    Category:
      required:
      - categoryType
      - description
      - name
      type: object
      properties:
        categoryType:
          type: string
        name:
          type: string
        description:
          type: string
    CloneDuplicationBlock:
      required:
      - fileDataId
      - fileId
      - fromLine
      - path
      - toLine
      type: object
      properties:
        path:
          type: string
        fileId:
          type: integer
          format: int64
        fileDataId:
          type: integer
          format: int64
        fromLine:
          type: integer
          format: int64
        toLine:
          type: integer
          format: int64
    CommitDeltaStatistics:
      required:
      - analyzed
      - commitUuid
      - fixedIssues
      - newIssues
      type: object
      properties:
        commitUuid:
          type: string
          description: Unique identifier of the commit
        newIssues:
          type: integer
          description: Number of issues introduced by the commit
          format: int32
        fixedIssues:
          type: integer
          description: Number of issues fixed by the commit
          format: int32
        deltaComplexity:
          type: integer
          description: Difference in cyclomatic complexity when compared to the previous commit
          format: int32
        deltaCoverage:
          type: integer
          description: Difference in code coverage percentage when compared to the previous commit
          format: int32
        deltaCoverageWithDecimals:
          multipleOf: 0.01
          type: number
          description: Difference in code coverage with decimals percentage when compared to the previous commit
          format: double
          example: 71
        deltaClonesCount:
          type: integer
          description: Difference in number of duplicated blocks of code when compared to the previous commit
          format: int32
        analyzed:
          type: boolean
          description: True if the commit was already analyzed by Codacy
      description: Delta quality metrics for a commit
    TooManyRequests:
      allOf:
      - $ref: '#/components/schemas/ApiError'
      - required:
        - error
        type: object
        properties:
          error:
            type: string
            default: TooManyRequests
    ParameterList:
      type: array
      items:
        $ref: '#/components/schemas/Parameter'
    Repository:
      allOf:
      - $ref: '#/components/schemas/RepositorySummary'
      - required:
        - addedState
        - languages
        - problems
        - standards
        - visibility
        type: object
        properties:
          fullPath:
            type: string
            description: Full path of the repository on the Git provider
            example: codacy/codacy-eslint
          visibility:
            $ref: '#/components/schemas/Visibility'
          remoteIdentifier:
            type: string
            description: Unique identifier of the repository on the Git provider
            example: '3'
          lastUpdated:
            type: string
            description: Timestamp when the repository was last updated. See [Git provider documentation](https://docs.codacy.com/organizations/organization-overview/#last-updated-repositories) for details.
            format: date-time
            example: '2019-05-07T14:29:13.43Z'
            x-scala-type: java.time.Instant
          permission:
            $ref: '#/components/schemas/Permission'
          problems:
            type: array
            items:
              $ref: '#/components/schemas/RepositoryProblem'
          languages:
            type: array
            description: List of the languages in the repository
            example:
            - Java
            - Scala
            - CSS
            items:
              type: string
          stack:
            $ref: '#/components/schemas/RepositoryStack'
          defaultBranch:
            $ref: '#/components/schemas/Branch'
          badges:
            $ref: '#/components/schemas/Badges'
          codingStandardId:
            type: integer
            description: '**Deprecated:** Use `standards` field instead. Coding standard identifier.'
            deprecated: true
            format: int64
          codingStandardName:
            type: string
            description: '**Deprecated:** Use `standards` field instead. Coding standard name.'
            deprecated: true
          standards:
            type: array
            description: List of the coding standard identifiers and names
            items:
              $ref: '#/components/schemas/CodingStandardInfo'
          addedState:
            $ref: '#/components/schemas/AddedState'
          gatePolicyId:
            type: integer
            description: Identifier of the gate policy the repository is following. If not defined, the repository does not follow a gate policy.
            format: int64
          gatePolicyName:
            type: string
            description: Name of the gate policy the repository is following. Present only if the gatePolicyId is defined.
    AnalysisAction:
      type: string
      enum:
      - clone
      - createTasks
      - runMetrics
      - runPatterns
      - createOverviews
      x-ms-enum:
        name: AnalysisAction
    AnalysisTool:
      required:
      - isClientSide
      - name
      - settings
      - uuid
      type: object
      properties:
        uuid:
          type: string
        name:
          type: string
        isClientSide:
          type: boolean
        settings:
          $ref: '#/components/schemas/AnalysisToolSettings'
    PullRequestWithAnalysis:
      required:
      - isAnalysing
      - meta
      - pullRequest
      type: object
      properties:
        isUpToStandards:
          type: boolean
          description: True if metrics are at or above gate thresholds
          example: true
        isAnalysing:
          type: boolean
          example: false
        pullRequest:
          $ref: '#/components/schemas/PullRequest'
        newIssues:
          type: integer
          description: Number of issues introduced by the pull request
          format: int32
          example: 1
        fixedIssues:
          type: integer
          description: Number of issues fixed by the pull request
          format: int32
          example: 1
        deltaComplexity:
          type: integer
          description: Difference in cyclomatic complexity introduced by the pull request
          format: int32
          example: 1
        deltaClonesCount:
          type: integer
          description: Difference in number of duplicated blocks of code introduced by the pull request
          format: int32
          example: 1
        deltaCoverageWithDecimals:
          multipleOf: 0.01
          type: number
          description: Deprecated, use `coverage` instead
          format: double
          example: 71
        deltaCoverage:
          type: integer
          description: Deprecated, use `coverage` instead
          format: int32
          example: 1
        diffCoverage:
          multipleOf: 0.01
          type: number
          description: Deprecated, use `coverage` instead
          format: double
          example: 71
        coverage:
          $ref: '#/components/schemas/PullRequestCoverage'
        quality:
          $ref: '#/components/schemas/QualityAnalysis'
        meta:
          $ref: '#/components/schemas/AnalysisMeta'
    DiffCoverage:
      required:
      - cause
      type: object
      properties:
        value:
