      description: 'Returns a list of issues introduced or fixed given a source commit SHA. By default, Codacy will calculate the issues by creating a delta between the source commit and its parent commit. As an alternative, you can also provide a destination commit to calculate the deltas.

        To list all issues in the repository, use searchRepositoryIssues.'
      operationId: listCommitDeltaIssues
      parameters:
