openapi: 3.2.0
info:
  title: Codacy Enterprise API
  description: 'Codacy API v3 reference.


    Import the OpenAPI 3.0.1 definition into your development tools to help bootstrap your integration with Codacy.

    For more information see Using the Codacy API.'
  contact:
    name: Codacy Team
    url: https://www.codacy.com
    email: code@codacy.com
  license:
    name: Codacy. All rights reserved
    url: https://www.codacy.com
  version: 3.1.0
servers:
- url: https://api.codacy.com/api/v3
security:
- ApiKeyAuth: []
tags:
- name: Enterprise
paths:
  /user/enterprise/integrations/{provider}:
    delete:
      tags:
      - Enterprise
      summary: Delete an Enterprise account token
      description: 'This endpoint allows the authenticated user to delete a GitHub Enterprise account token.

        The token will no longer be used to access enterprise-level resources on GitHub.'
      operationId: deleteEnterpriseToken
      parameters:
      - $ref: '#/components/parameters/providerParam'
      responses:
        '204':
          description: Successful operation
          content: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-jvm-package: enterprise
  /user/enterprise/integrations:
    get:
      tags:
      - Enterprise
      summary: List user configured enterprise provider account tokens on Codacy's platform
      operationId: listUserEnterpriseProviderTokens
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterpriseAccountTokenListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-jvm-package: enterprise
    post:
      tags:
      - Enterprise
      summary: Add an Enterprise account token
      description: 'This endpoint allows the authenticated user to add a GitHub Enterprise account token with read permissions.

        The token will be used to access enterprise-level resources on GitHub.'
      operationId: addEnterpriseToken
      requestBody:
        description: Information of the enterprise token to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddEnterpriseAccountTokenBody'
        required: true
      responses:
        '204':
          description: Successful operation
          content: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-jvm-package: enterprise
      x-codegen-request-body-name: addEnterpriseProviderToken
  /enterprises/{provider}/{enterpriseName}/organizations:
    get:
      tags:
      - Enterprise
      summary: Get the organizations of an enterprise
      operationId: listEnterpriseOrganizations
      parameters:
      - $ref: '#/components/parameters/enterpriseNameParam'
      - $ref: '#/components/parameters/cursorParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/providerParam'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterpriseOrganizationsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-jvm-package: enterprise
  /enterprises/{provider}:
    get:
      tags:
      - Enterprise
      summary: List user enterprises
      operationId: listEnterprises
      parameters:
      - $ref: '#/components/parameters/cursorParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/providerParam'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterpriseListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
      x-jvm-package: enterprise
  /enterprises/{provider}/{enterpriseName}:
    get:
      tags:
      - Enterprise
      summary: Get an enterprise
      operationId: getEnterprise
      parameters:
      - $ref: '#/components/parameters/enterpriseNameParam'
      - $ref: '#/components/parameters/providerParam'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEnterpriseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
      x-jvm-package: enterprise
  /enterprises/{provider}/{enterpriseName}/seats:
    get:
      tags:
      - Enterprise
      summary: Get enterprise seats
      operationId: listEnterpriseSeats
      parameters:
      - $ref: '#/components/parameters/providerParam'
      - $ref: '#/components/parameters/enterpriseNameParam'
      - $ref: '#/components/parameters/cursorParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/searchParam'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-jvm-package: enterprise
components:
  schemas:
    NotFound:
      allOf:
      - $ref: '#/components/schemas/ApiError'
      - required:
        - error
        type: object
        properties:
          error:
            type: string
            default: NotFound
    EnterpriseOrganization:
      required:
      - avatar
      - name
      - remoteId
      - url
      type: object
      properties:
        id:
          type: integer
          description: Internal Codacy organization id
          format: int64
          example: 42
        remoteId:
          type: string
          description: Organization ID in provider
          example: group-id
        name:
          type: string
          description: Organization name.
          example: my-enterprise
        displayName:
          type: string
          description: Organization display name.
          example: My Enterprise
        userRole:
          type: string
          description: User role in the organization.
          example: Owner
          enum:
          - admin
          - member
        url:
          type: string
          description: Organization URL
          example: https://github.com/enterprises/my-enterprise
        avatar:
          type: string
          description: Organization avatar URL
      description: Organization in an enterprise
    ApiError:
      required:
      - actions
      - message
      type: object
      properties:
        message:
          type: string
        innerMessage:
          type: string
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ProblemLink'
    SeatsResponse:
      required:
      - data
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Seat'
    Forbidden:
      allOf:
      - $ref: '#/components/schemas/ApiError'
      - required:
        - error
        type: object
        properties:
          error:
            type: string
            default: Forbidden
    AddEnterpriseAccountTokenBody:
      required:
      - provider
      - token
      type: object
      properties:
        token:
          type: string
        provider:
          $ref: '#/components/schemas/Provider'
      description: Details of a new enterprise account token
    EnterpriseEntity:
      required:
      - avatarUrl
      - displayName
      - name
      - provider
      - url
      - userRole
      type: object
      properties:
        name:
          type: string
          description: Enterprise name. This is used as stable Enterprise Identifier
        displayName:
          type: string
          description: Enterprise remote name. This is not Enterprise Identifier
        userRole:
          type: string
          enum:
          - admin
          - member
        url:
          type: string
        avatarUrl:
          type: string
        provider:
          $ref: '#/components/schemas/Provider'
    EnterpriseOrganizationsResponse:
      required:
      - data
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
        data:
          type: array
          items:
            $ref: '#/components/schemas/EnterpriseOrganization'
    BadRequest:
      allOf:
      - $ref: '#/components/schemas/ApiError'
      - required:
        - error
        type: object
        properties:
          error:
            type: string
            default: BadRequest
    Provider:
      type: string
      description: Git provider hosting the repository
      example: gh
    EnterpriseAccountToken:
      required:
      - provider
      type: object
      properties:
        provider:
          $ref: '#/components/schemas/Provider'
      description: Enterprise account token
    BadGateway:
      allOf:
      - $ref: '#/components/schemas/ApiError'
      - required:
        - error
        type: object
        properties:
          error:
            type: string
            default: BadGateway
    EnterpriseListResponse:
      required:
      - data
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EnterpriseEntity'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
    UnprocessableEntity:
      allOf:
      - $ref: '#/components/schemas/ApiError'
      - required:
        - error
        type: object
        properties:
          error:
            type: string
            default: UnprocessableEntity
    InternalServerError:
      allOf:
      - $ref: '#/components/schemas/ApiError'
      - required:
        - error
        type: object
        properties:
          error:
            type: string
            default: InternalServerError
    PaginationInfo:
      type: object
      properties:
        cursor:
          type: string
          description: Cursor to [request the next batch of results](https://docs.codacy.com/codacy-api/using-the-codacy-api/#using-pagination)
        limit:
          type: integer
          description: Maximum number of items returned
          format: int32
        total:
          type: integer
          description: Total number of items returned
          format: int32
      description: Cursor-based pagination information to obtain more items
    ProblemLink:
      required:
      - name
      - url
      type: object
      properties:
        name:
          type: string
          example: Check our documentation
        url:
          type: string
          example: https://docs.codacy.com/faq/troubleshooting/why-isnt-my-public-repository-being-analyzed/
    GetEnterpriseResponse:
      required:
      - data
      type: object
      properties:
        data:
          $ref: '#/components/schemas/EnterpriseEntity'
    EnterpriseAccountTokenListResponse:
      required:
      - data
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EnterpriseAccountToken'
      description: List of enterprise account tokens
    Unauthorized:
      allOf:
      - $ref: '#/components/schemas/ApiError'
      - required:
        - code
        - error
        type: object
        properties:
          error:
            type: string
            default: Unauthorized
          code:
            type: string
            default: Unauthorized
    Seat:
      required:
      - createdAt
      - emails
      - isActive
      - organizationsIds
      type: object
      properties:
        organizationsIds:
          type: array
          items:
            type: integer
            format: int64
        emails:
          type: array
          items:
            type: string
        lastAnalysis:
          type: string
          format: date-time
          x-scala-type: java.time.Instant
        createdAt:
          type: string
          format: date-time
          x-scala-type: java.time.Instant
        lastCommitId:
          type: integer
          format: int64
        providerId:
          type: string
        providerLogin:
          type: string
        isActive:
          type: boolean
    Conflict:
      allOf:
      - $ref: '#/components/schemas/ApiError'
      - required:
        - error
        type: object
        properties:
          error:
            type: string
            default: Conflict
  responses:
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFound'
      x-ms-error-response: true
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Conflict'
      x-ms-error-response: true
    UnprocessableEntity:
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnprocessableEntity'
      x-ms-error-response: true
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Forbidden'
      x-ms-error-response: true
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequest'
      x-ms-error-response: true
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Unauthorized'
      x-ms-error-response: true
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerError'
      x-ms-error-response: true
    BadGateway:
      description: Bad Gateway
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadGateway'
      x-ms-error-response: true
  parameters:
    cursorParam:
      name: cursor
      in: query
      description: Cursor to [specify a batch of results to request](https://docs.codacy.com/codacy-api/using-the-codacy-api/#using-pagination)
      schema:
        type: string
        x-ms-parameter-location: method
      example: Yms345gh==
      x-ms-parameter-location: method
    searchParam:
      name: search
      in: query
      description: Filter results by searching for this string
      schema:
        type: string
        x-ms-parameter-location: method
      example: my-repository-name
      x-ms-parameter-location: method
    providerParam:
      name: provider
      in: path
      description: Git provider identifier (e.g., gh for GitHub, gl for GitLab, bb for Bitbucket)
      required: true
      schema:
        type: string
        x-ms-parameter-location: method
      example: gh
      x-ms-parameter-location: method
    enterpriseNameParam:
      name: enterpriseName
      in: path
      description: Enterprise name (slug)
      required: true
      schema:
        type: string
        x-ms-parameter-location: method
      example: my-enterprise
      x-ms-parameter-location: method
    limitParam:
      name: limit
      in: query
      description: Maximum number of items to return
      schema:
        maximum: 100
        minimum: 1
        type: integer
        format: int32
        default: 100
        x-ms-parameter-location: method
      example: 20
      x-ms-parameter-location: method
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      description: Learn how to [generate an account API token](https://docs.codacy.com/codacy-api/api-tokens/#account-api-tokens)
      name: api-token
      in: header
    ProjectTokenAuth:
      type: apiKey
      name: project-token
      in: header
      description: 'Repository API token. Accepted only by repository-scoped operations that declare it.

        Create one with [createRepositoryApiToken](#createrepositoryapitoken)

        '
x-provenance:
  method: harvested
  publisher: Codacy
  source: https://api.codacy.com/api/api-docs/swagger.yaml
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
