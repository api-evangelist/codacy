openapi: 3.2.0
info:
  title: Codacy Coverage API
  description: 'Codacy API v3 reference.


    Import the OpenAPI 3.0.1 definition into your development tools to help bootstrap your integration with Codacy.

    For more information see Using the Codacy API.'
  contact:
    name: Codacy Team
    url: https://www.codacy.com
    email: code@codacy.com
  license:
    name: Codacy. All rights reserved
    url: https://www.codacy.com
  version: 3.1.0
servers:
- url: https://api.codacy.com/api/v3
security:
- ApiKeyAuth: []
tags:
- name: Coverage
paths:
  ? /coverage/organizations/{provider}/{remoteOrganizationName}/repositories/{repositoryName}/pull-requests/{pullRequestNumber}
  : get:
      tags:
      - Coverage
      summary: Get pull request coverage information from a repository
      description: '**Note:** When applied to public repositories, this operation does not require authentication.'
      operationId: getRepositoryPullRequestCoverage
      parameters:
      - $ref: '#/components/parameters/providerParam'
      - $ref: '#/components/parameters/remoteOrganizationNameParam'
      - $ref: '#/components/parameters/repositoryNameParam'
      - $ref: '#/components/parameters/pullRequestNumberParam'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequestWithCoverageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-jvm-package: coverage
  ? /coverage/organizations/{provider}/{remoteOrganizationName}/repositories/{repositoryName}/pull-requests/{pullRequestNumber}/files
  : get:
      tags:
      - Coverage
      summary: Get pull request files coverage information from a repository
      description: '**Note:** When applied to public repositories, this operation does not require authentication.'
      operationId: getRepositoryPullRequestFilesCoverage
      parameters:
      - $ref: '#/components/parameters/providerParam'
      - $ref: '#/components/parameters/remoteOrganizationNameParam'
      - $ref: '#/components/parameters/repositoryNameParam'
      - $ref: '#/components/parameters/pullRequestNumberParam'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequestFilesCoverageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-jvm-package: coverage
  ? /coverage/organizations/{provider}/{remoteOrganizationName}/repositories/{repositoryName}/pull-requests/{pullRequestNumber}/reanalyze
  : get:
      tags:
      - Coverage
      summary: Triggers the reanalysis of the latest coverage report uploaded for the pull…
      operationId: reanalyzeCoverage
      parameters:
      - $ref: '#/components/parameters/providerParam'
      - $ref: '#/components/parameters/remoteOrganizationNameParam'
      - $ref: '#/components/parameters/repositoryNameParam'
      - $ref: '#/components/parameters/pullRequestNumberParam'
      responses:
        '204':
          description: Successful operation
          content: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-jvm-package: coverage
  /coverage/organizations/{provider}/{remoteOrganizationName}/repositories/{repositoryName}/commits/{commitUuid}/reanalyze:
    post:
      tags:
      - Coverage
      summary: Reanalyze the coverage for a commit
      description: 'Triggers the reanalysis of the latest coverage report uploaded for the commit.

        Has no effect if the commit does not have any coverage report.'
      operationId: reanalyzeCommitCoverage
      parameters:
      - $ref: '#/components/parameters/providerParam'
      - $ref: '#/components/parameters/remoteOrganizationNameParam'
      - $ref: '#/components/parameters/repositoryNameParam'
      - $ref: '#/components/parameters/commitUuid'
      responses:
        '204':
          description: Successful operation
          content: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-jvm-package: coverage
  ? /analysis/organizations/{provider}/{remoteOrganizationName}/repositories/{repositoryName}/pull-requests/{pullRequestNumber}/coverage/status
  : get:
      tags:
      - Coverage
      summary: List all coverage reports uploaded for the common ancestor commit and head…
      operationId: getPullRequestCoverageReports
      parameters:
      - $ref: '#/components/parameters/providerParam'
      - $ref: '#/components/parameters/remoteOrganizationNameParam'
      - $ref: '#/components/parameters/repositoryNameParam'
      - $ref: '#/components/parameters/pullRequestNumberParam'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoveragePullRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-jvm-package: analysis
  /organizations/{provider}/{remoteOrganizationName}/repositories/{repositoryName}/coverage/status:
    get:
      tags:
      - Coverage
      summary: List the most recent coverage reports and their status
      operationId: listCoverageReports
      parameters:
      - $ref: '#/components/parameters/providerParam'
      - $ref: '#/components/parameters/remoteOrganizationNameParam'
      - $ref: '#/components/parameters/repositoryNameParam'
      - $ref: '#/components/parameters/limitParam'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageReportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-jvm-package: repository
  /organizations/{provider}/{remoteOrganizationName}/repositories/{repositoryName}/commits/{commitUuid}/coverage/reports:
    get:
      tags:
      - Coverage
      summary: List coverage reports for a commit
      operationId: listCommitCoverageReports
      parameters:
      - $ref: '#/components/parameters/providerParam'
      - $ref: '#/components/parameters/remoteOrganizationNameParam'
      - $ref: '#/components/parameters/repositoryNameParam'
      - $ref: '#/components/parameters/commitUuid'
      - $ref: '#/components/parameters/cursorParam'
      - $ref: '#/components/parameters/limitParam'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageReportEntryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-jvm-package: repository
  ? /organizations/{provider}/{remoteOrganizationName}/repositories/{repositoryName}/commits/{commitUuid}/coverage/reports/{reportUuid}
  : get:
      tags:
      - Coverage
      summary: Get a coverage report with its contents
      operationId: getCoverageReport
      parameters:
      - $ref: '#/components/parameters/providerParam'
      - $ref: '#/components/parameters/remoteOrganizationNameParam'
      - $ref: '#/components/parameters/repositoryNameParam'
      - $ref: '#/components/parameters/commitUuid'
      - $ref: '#/components/parameters/reportUuid'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageReportContentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-jvm-package: repository
  ? /coverage/organizations/{provider}/{remoteOrganizationName}/repositories/{repositoryName}/pull-requests/{pullRequestNumber}/diff
  : get:
      tags:
      - Coverage
      summary: Get the human-readable Git diff of a pull request
      description: '**Deprecated:** Use getDiffBetweenCommits instead.'
      deprecated: true
      operationId: getPullRequestGitDiff
      parameters:
      - $ref: '#/components/parameters/providerParam'
      - $ref: '#/components/parameters/remoteOrganizationNameParam'
      - $ref: '#/components/parameters/repositoryNameParam'
      - $ref: '#/components/parameters/pullRequestNumberParam'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiffResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-jvm-package: coverage
components:
  schemas:
    NotFound:
      allOf:
      - $ref: '#/components/schemas/ApiError'
      - required:
        - error
        type: object
        properties:
          error:
            type: string
            default: NotFound
    PullRequest:
      required:
      - gitHref
      - id
      - number
      - owner
      - repository
      - status
      - title
      - updated
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        number:
          type: integer
          format: int32
          example: 1
        updated:
          type: string
          format: date-time
          example: '2019-05-07T14:29:13.43Z'
          x-scala-type: java.time.Instant
        status:
          type: string
          description: Pull request status
          example: open
        repository:
          type: string
          example: awesome-repository
        title:
          type: string
          example: Amazing pull request
        owner:
          $ref: '#/components/schemas/PullRequestOwner'
        headCommitSha:
          type: string
          example: 2957025d42e8daadf937d4044516f991d21deea4
        commonAncestorCommitSha:
          type: string
          example: 3357025d42e8daadf937d4044516f991d21deea4
        originBranch:
          type: string
          example: feat-branch
        targetBranch:
          type: string
          example: master
        gitHref:
          type: string
          description: URL to the pull request on the Git provider
          example: https://github.com/...
    PayloadTooLarge:
      allOf:
      - $ref: '#/components/schemas/ApiError'
      - required:
        - error
        type: object
        properties:
          error:
            type: string
            default: PayloadTooLarge
    ApiError:
      required:
      - actions
      - message
      type: object
      properties:
        message:
          type: string
        innerMessage:
          type: string
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ProblemLink'
    AnalysisResultReason:
      required:
      - expectedThreshold
      - gate
      - isUpToStandards
      type: object
      properties:
        gate:
          type: string
          description: Name of the quality gate
        expected:
          type: number
          description: '**Deprecated:** Use `expectedThreshold` instead. The threshold value configured for the quality gate.'
          deprecated: true
          example: -1
        expectedThreshold:
          $ref: '#/components/schemas/AnalysisExpectedThreshold'
        isUpToStandards:
          type: boolean
          description: True if the value passes the quality gate
          example: true
      description: Reason for an analysis result for a quality gate
    CoveragePullRequestResponse:
      required:
      - data
      type: object
      properties:
        data:
          required:
          - commonAncestorCommit
          - headCommit
          - origin
          - target
          type: object
          properties:
            headCommit:
              $ref: '#/components/schemas/CoveragePullRequestCommitDetail'
            commonAncestorCommit:
              $ref: '#/components/schemas/CoveragePullRequestCommitDetail'
            origin:
              $ref: '#/components/schemas/CoveragePullRequestCommitDetail'
            target:
              $ref: '#/components/schemas/CoveragePullRequestCommitDetail'
      description: 'Status and details about the coverage reports uploaded for the head commit

        and common ancestor commit of the pull request.

        '
    CoverageReportEntry:
      required:
      - repositoryId
      - commitSha
      - reportId
      - isFinal
      - processed
      - createdAt
      type: object
      properties:
        repositoryId:
          type: integer
          format: int64
        commitSha:
          type: string
        reportId:
          type: string
        language:
          type: string
        isFinal:
          type: boolean
        processed:
          type: boolean
        createdAt:
          type: string
          format: date-time
    Forbidden:
      allOf:
      - $ref: '#/components/schemas/ApiError'
      - required:
        - error
        type: object
        properties:
          error:
            type: string
            default: Forbidden
    CoverageReportContentResponse:
      required:
      - data
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CoverageReportContent'
    CoverageReport:
      required:
      - createdAt
      - status
      - targetCommitSha
      type: object
      properties:
        targetCommitSha:
          type: string
          description: Commit SHA that was referenced as the target for this report
        commit:
          $ref: '#/components/schemas/CommitWithBranches'
        language:
          type: string
          description: Programming language associated with the coverage report
        createdAt:
          type: string
          description: Report creation date
          format: date-time
          x-scala-type: java.time.Instant
        status:
          type: string
          description: Coverage status
          enum:
          - Pending
          - Processed
          - CommitNotAnalysed
          - CommitNotFound
          - BranchNotEnabled
          - MissingFinal
      description: Status and details of a coverage report
    AnalysisExpectedThreshold:
      required:
      - threshold
      type: object
      properties:
        threshold:
          type: number
          description: Threshold configured for the given gate
        minimumSeverity:
          $ref: '#/components/schemas/SeverityLevel'
      description: Expected threshold for the given gate
    PullRequestFilesCoverageResponse:
      required:
      - data
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FileDiffCoverage'
    BadRequest:
      allOf:
      - $ref: '#/components/schemas/ApiError'
      - required:
        - error
        type: object
        properties:
          error:
            type: string
            default: BadRequest
    CommitIdentification:
      required:
      - sha
      type: object
      properties:
        sha:
          type: string
          description: Commit SHA
    CoverageReportResponse:
      required:
      - data
      type: object
      properties:
        data:
          type: object
          properties:
            hasCoverageOverview:
              type: boolean
              description: True if the Quality evolution chart of the repository includes coverage information
            lastReports:
              type: array
              items:
                $ref: '#/components/schemas/CoverageReport'
    Commit:
      allOf:
      - $ref: '#/components/schemas/CommitIdentification'
      - required:
        - commitTimestamp
        - id
        - authorName
        - authorEmail
        - message
        type: object
        properties:
          id:
            type: integer
            description: Internal commit identifier
            format: int64
            example: 1
          commitTimestamp:
            type: string
            description: Timestamp when the commit was created
            format: date-time
            example: '2019-05-07T14:29:13.43Z'
            x-scala-type: java.time.Instant
          authorName:
            type: string
            description: Name of the commit author
          authorEmail:
            type: string
            description: Email address of the commit author
          message:
            type: string
            description: Commit message
          startedAnalysis:
            type: string
            description: Timestamp when Codacy started the last analysis of the commit
            format: date-time
            example: '2022-01-07T14:29:13.43Z'
            x-scala-type: java.time.Instant
          endedAnalysis:
            type: string
            description: Timestamp when Codacy finished the last analysis of the commit
            format: date-time
            example: '2022-01-07T14:29:13.43Z'
            x-scala-type: java.time.Instant
          isMergeCommit:
            type: boolean
            description: True if the commit is a merge commit
            example: false
          gitHref:
            type: string
            description: URL to the commit on the Git provider
            example: https://github.com/codacy/tools-for-code-review-engineers/commit/370b160aaf0ed781d707d335aa1fde20cefeabf2
          parents:
            type: array
            items:
              type: string
              description: SHA-1 hashes of the parents of the commit
    PullRequestOwner:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          example: Foo
        avatarUrl:
          type: string
          example: https://example.com/foo
        username:
          type: string
          example: foo.bar
        email:
          type: string
          example: foobar@example.com
    PullRequestCoverage:
      type: object
      properties:
        deltaCoverage:
          multipleOf: 0.01
          type: number
          description: Difference between the coverage of the head commit and common ancestor commit of the pull request
          format: double
          example: 71
        diffCoverage:
          $ref: '#/components/schemas/DiffCoverage'
        isUpToStandards:
          type: boolean
          description: True if coverage metrics are at or above gate thresholds
          example: true
        resultReasons:
          type: array
          description: Reasons for the results of coverage analysis
          items:
            $ref: '#/components/schemas/AnalysisResultReason'
    UnprocessableEntity:
      allOf:
      - $ref: '#/components/schemas/ApiError'
      - required:
        - error
        type: object
        properties:
          error:
            type: string
            default: UnprocessableEntity
    PullRequestWithCoverage:
      required:
      - coverage
      - pullRequest
      type: object
      properties:
        pullRequest:
          $ref: '#/components/schemas/PullRequest'
        coverage:
          $ref: '#/components/schemas/PullRequestCoverage'
    FileDiffCoverage:
      required:
      - coverage
      - diffLineHits
      - fileName
      type: object
      properties:
        fileName:
          type: string
        coverage:
          type: number
        variation:
          type: number
        diff:
          $ref: '#/components/schemas/DiffCoverage'
        diffLineHits:
          type: array
          items:
            $ref: '#/components/schemas/DiffLineHit'
    PullRequestWithCoverageResponse:
      required:
      - data
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PullRequestWithCoverage'
    DiffLineHit:
      required:
      - hits
      - lineNumber
      type: object
      properties:
        lineNumber:
          type: string
        hits:
          type: integer
          format: int64
    PullRequestCoverageReport:
      required:
      - createdAt
      - status
      - targetCommitSha
      type: object
      properties:
        targetCommitSha:
          type: string
          description: Commit SHA that was referenced as the target for this report
        commit:
          $ref: '#/components/schemas/CommitWithBranches'
        language:
          type: string
          description: Programming language associated with the coverage report
        createdAt:
          type: string
          description: Report creation date
          format: date-time
          x-scala-type: java.time.Instant
        status:
          type: string
          description: Coverage status
          enum:
          - Pending
          - Processed
          - CommitNotAnalysed
          - CommitNotFound
          - BranchNotEnabled
          - MissingFinal
      description: Status and details of a pull request coverage report
    InternalServerError:
      allOf:
      - $ref: '#/components/schemas/ApiError'
      - required:
        - error
        type: object
        properties:
          error:
            type: string
            default: InternalServerError
    PaginationInfo:
      type: object
      properties:
        cursor:
          type: string
          description: Cursor to [request the next batch of results](https://docs.codacy.com/codacy-api/using-the-codacy-api/#using-pagination)
        limit:
          type: integer
          description: Maximum number of items returned
          format: int32
        total:
          type: integer
          description: Total number of items returned
          format: int32
      description: Cursor-based pagination information to obtain more items
    ProblemLink:
      required:
      - name
      - url
      type: object
      properties:
        name:
          type: string
          example: Check our documentation
        url:
          type: string
          example: https://docs.codacy.com/faq/troubleshooting/why-isnt-my-public-repository-being-analyzed/
    Branch:
      required:
      - branchType
      - id
      - isDefault
      - isEnabled
      - name
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: master
        isDefault:
          type: boolean
          example: true
        isEnabled:
          type: boolean
          example: true
        lastUpdated:
          type: string
          format: date-time
          example: '2019-05-07T14:29:13.43Z'
          x-scala-type: java.time.Instant
        branchType:
          type: string
          enum:
          - Branch
          - PullRequest
        lastCommit:
          type: string
    DiffCoverage:
      required:
      - cause
      type: object
      properties:
        value:
          multipleOf: 0.01
          type: number
          description: Coverage value of the lines added or modified by the pull request
          format: double
          example: 71
        coveredLines:
          type: integer
          description: Number of covered lines from the lines added or modified by the pull request
          format: int32
          example: 11
        coverableLines:
          type: integer
          description: Number of coverable lines from the lines added or modified by the pull request
          format: int32
          example: 21
        cause:
          type: string
          description: Rationale for diffCoverage value interpretation
          example: NoCoverableLines
          enum:
          - ValueIsPresent
          - NoCoverableLines
          - MissingRequirements
          x-ms-enum:
            name: DiffCoverageReason
    CommitWithBranches:
      allOf:
      - $ref: '#/components/schemas/Commit'
      - type: object
        properties:
          branches:
            type: array
            description: List of branches containing the commit
            items:
              $ref: '#/components/schemas/Branch'
    CoveragePullRequestCommitDetail:
      required:
      - commitId
      - commitSha
      - reports
      type: object
      properties:
        commitId:
          type: integer
          format: int64
          example: 1
        commitSha:
          type: string
        reports:
          type: array
          items:
            $ref: '#/components/schemas/PullRequestCoverageReport'
      description: Status and details of the coverage reports received for a pull request commit
    CoverageReportContent:
      required:
      - repositoryId
      - commitSha
      - reportId
      - isFinal
      - processed
      - createdAt
      - content
      type: object
      properties:
        repositoryId:
          type: integer
          format: int64
        commitSha:
          type: string
        reportId:
          type: string
        language:
          type: string
        isFinal:
          type: boolean
        processed:
          type: boolean
        createdAt:
          type: string
          format: date-time
        content:
          type: array
          items:
            $ref: '#/components/schemas/CoverageReportFile'
    CoverageReportEntryResponse:
      required:
      - data
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CoverageReportEntry'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
    DiffResponse:
      required:
      - diff
      type: object
      properties:
        diff:
          type: string
