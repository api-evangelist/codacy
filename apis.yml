aid: codacy
url: https://raw.githubusercontent.com/api-evangelist/codacy/refs/heads/main/apis.yml
name: Codacy
kind: company
description: Codacy is an automated code quality and security platform that analyzes
  commits and pull requests across 49+ languages, surfacing issues, coverage, and
  security findings. The Codacy API v3 lets teams manage organizations, repositories,
  issues, pull requests, coverage, security, and quality settings programmatically.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Code Quality
- Static Analysis
- Security
- Code Coverage
- DevOps
created: '2026-06-21'
modified: '2026-06-21'
specificationVersion: '0.19'
